name: lab

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install flask requests pytest

      - name: Test
        run: pytest

      - name: Lint YAML + shell scripts (best-effort)
        run: |
          python -c "import yaml,glob,sys; [yaml.safe_load(open(f)) for f in glob.glob('**/*.yml', recursive=True)]; print('yaml ok')"
          for f in attacker/*.sh run-local.sh; do bash -n "$f"; done
